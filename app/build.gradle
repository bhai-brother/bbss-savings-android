plugins {
    id 'com.android.application'
}

def signingStore = System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingStore && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'com.bhaibrother.bbsssavings'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bhaibrother.bbsssavings'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
